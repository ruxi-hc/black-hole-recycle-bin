        function setupInnerHalo() {
            const haloCanvas = document.getElementById('inner-ring');
            const haloContext = haloCanvas.getContext('2d');
            const tau = Math.PI * 2;

            function resizeHalo() {
                const density = Math.min(window.devicePixelRatio || 1, 2);
                const width = Math.max(1, Math.round(window.innerWidth * density));
                const height = Math.max(1, Math.round(window.innerHeight * density));
                if (haloCanvas.width !== width || haloCanvas.height !== height) {
                    haloCanvas.width = width;
                    haloCanvas.height = height;
                }
                haloContext.setTransform(density, 0, 0, density, 0, 0);
            }

            function renderHalo(now) {
                resizeHalo();
                haloContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                const state = document.body.dataset.blackHoleState;
                const capturing = state === 'capture';
                const sensing = state === 'sensing';
                const spin = now * (capturing ? 0.00315 : sensing ? 0.00228 : 0.00105);
                const brightness = capturing ? 1.42 : sensing ? 1.10 : 0.46;

                haloContext.save();
                haloContext.translate(centerX, centerY);
                haloContext.rotate(-0.34);
                haloContext.scale(1, 0.42);
                haloContext.lineCap = 'round';
                for (let segment = 0; segment < 13; segment += 1) {
                    const start = spin + segment * tau / 13;
                    const arcLength = 0.23 + (segment % 4) * 0.035;
                    const radius = 29 + (segment % 3 - 1) * 1.1;
                    haloContext.globalAlpha = brightness * (segment % 5 === 0 ? 0.86 : 0.36);
                    haloContext.strokeStyle = segment % 4 === 0 ? '#fffaf0' : '#ead9b4';
                    haloContext.lineWidth = segment % 5 === 0 ? 1.35 : 0.72;
                    haloContext.beginPath();
                    haloContext.arc(0, 0, radius, start, start + arcLength);
                    haloContext.stroke();
                }
                haloContext.restore();

                haloContext.save();
                haloContext.globalCompositeOperation = 'screen';
                for (let particle = 0; particle < 8; particle += 1) {
                    const angle = -spin * 1.35 + particle * tau / 8;
                    const radius = 25 + (particle % 3) * 3;
                    const x = centerX + Math.cos(angle) * radius;
                    const y = centerY + Math.sin(angle) * radius * 0.43;
                    haloContext.globalAlpha = brightness * (particle % 3 === 0 ? 0.72 : 0.28);
                    haloContext.fillStyle = particle % 3 === 0 ? '#fff9e8' : '#e7d3aa';
                    haloContext.beginPath();
                    haloContext.arc(x, y, particle % 3 === 0 ? 1.15 : 0.68, 0, tau);
                    haloContext.fill();
                }
                haloContext.restore();

                requestAnimationFrame(renderHalo);
            }

            window.addEventListener('resize', resizeHalo);
            requestAnimationFrame(renderHalo);
        }

        function setupDesktopInteractions() {
            const canvas = document.getElementById('glCanvas');
            const infallLayer = document.getElementById('infall-layer');
            const dragProxyBack = document.getElementById('drag-proxy-back');
            const dragProxyFront = document.getElementById('drag-proxy-front');
            const dragBackContext = dragProxyBack.getContext('2d');
            const dragFrontContext = dragProxyFront.getContext('2d');
            const fileSprite = document.createElement('canvas');
            const spriteWidth = 66;
            const spriteHeight = 72;
            const meshColumns = 10;
            const meshRows = 12;
            fileSprite.width = spriteWidth;
            fileSprite.height = spriteHeight;
            const fileSpriteContext = fileSprite.getContext('2d');
            let spriteName = '';
            let dragState;
            let dragAnimationFrame;
            let completeStateTimer;
            let vortexAnimationFrame;
            let activeInfall;
            const ACCRETION_ROTATION = -1;
            const CAPTURE_DURATION = 2050;
            const ORBIT_DURATION = 1335;
            const InteractionState = Object.freeze({
                NORMAL: 'normal',
                SENSING: 'sensing',
                CAPTURE: 'capture',
                COMPLETE: 'complete',
            });
            let interactionState = InteractionState.NORMAL;
            let movingWindow = false;
            document.body.dataset.blackHoleState = InteractionState.NORMAL;

            canvas.addEventListener('pointerdown', (event) => {
                if (event.button !== 0 || !window.blackHoleHost) return;
                movingWindow = true;
                canvas.setPointerCapture(event.pointerId);
                window.blackHoleHost.startWindowDrag({ x: event.screenX, y: event.screenY });
            });

            canvas.addEventListener('pointermove', (event) => {
                if (movingWindow) window.blackHoleHost.moveWindow({ x: event.screenX, y: event.screenY });
            });

            const stopMovingWindow = () => {
                if (!movingWindow) return;
                movingWindow = false;
                window.blackHoleHost.endWindowDrag();
            };
            canvas.addEventListener('pointerup', stopMovingWindow);
            canvas.addEventListener('pointercancel', stopMovingWindow);

            const containsFiles = (event) => Array.from(event.dataTransfer?.types || []).includes('Files');

            function clamp(value, min, max) {
                return Math.min(max, Math.max(min, value));
            }

            function lerp(from, to, amount) {
                return from + (to - from) * amount;
            }

            function smoothstep(from, to, value) {
                const t = clamp((value - from) / (to - from), 0, 1);
                return t * t * (3 - 2 * t);
            }

            function setInteractionState(nextState) {
                interactionState = nextState;
                document.body.dataset.blackHoleState = nextState;
            }

            function getBlackHoleGeometry() {
                return {
                    coreX: canvas.clientWidth / 2,
                    coreY: canvas.clientHeight / 2,
                    lensRadius: Math.max(104, Math.min(112, canvas.clientWidth * 0.44)),
                    captureRadius: Math.max(58, Math.min(64, canvas.clientWidth * 0.248)),
                    horizonRadius: Math.max(12, Math.min(18, canvas.clientHeight * 0.12)),
                    diskAspect: 0.56,
                };
            }

            function gravityField(x, y, geometry) {
                const offsetX = geometry.coreX - x;
                const offsetY = geometry.coreY - y;
                const distance = Math.max(0.75, Math.hypot(offsetX, offsetY));
                return {
                    distance,
                    directionX: offsetX / distance,
                    directionY: offsetY / distance,
                    strength: Math.pow(clamp(1 - distance / geometry.lensRadius, 0, 1), 1.32),
                };
            }

            function shortenFileName(name, maxWidth) {
                if (fileSpriteContext.measureText(name).width <= maxWidth) return name;
                let shortened = name;
                while (shortened.length > 1 && fileSpriteContext.measureText(`${shortened}...`).width > maxWidth) {
                    shortened = shortened.slice(0, -1);
                }
                return `${shortened}...`;
            }

            function drawFileSprite(name) {
                if (spriteName === name) return;
                spriteName = name;
                const context = fileSpriteContext;
                const label = name || '文件';
                context.clearRect(0, 0, spriteWidth, spriteHeight);

                context.save();
                context.shadowColor = 'rgba(255, 235, 190, 0.92)';
                context.shadowBlur = 9;
                context.fillStyle = 'rgba(248, 247, 240, 0.96)';
                context.strokeStyle = 'rgba(255, 252, 239, 0.98)';
                context.lineWidth = 1;
                context.beginPath();
                context.moveTo(16, 4);
                context.lineTo(41, 4);
                context.lineTo(50, 13);
                context.lineTo(50, 49);
                context.lineTo(16, 49);
                context.closePath();
                context.fill();
                context.stroke();
                context.shadowColor = 'transparent';
                context.fillStyle = 'rgba(214, 210, 196, 0.98)';
                context.beginPath();
                context.moveTo(41, 4);
                context.lineTo(41, 13);
                context.lineTo(50, 13);
                context.closePath();
                context.fill();
                context.strokeStyle = 'rgba(122, 117, 101, 0.75)';
                context.beginPath();
                context.moveTo(22, 24);
                context.lineTo(44, 24);
                context.moveTo(22, 29);
                context.lineTo(43, 29);
                context.moveTo(22, 34);
                context.lineTo(38, 34);
                context.stroke();
                context.restore();

                context.save();
                context.fillStyle = '#fff9e9';
                context.shadowColor = '#000000';
                context.shadowBlur = 4;
                context.font = '9px "Microsoft YaHei", sans-serif';
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                context.fillText(shortenFileName(label, 62), spriteWidth / 2, 62);
                context.restore();
            }

            function prepareDragCanvases() {
                const density = Math.min(window.devicePixelRatio || 1, 2);
                const width = Math.max(1, Math.round(window.innerWidth * density));
                const height = Math.max(1, Math.round(window.innerHeight * density));
                [[dragProxyBack, dragBackContext], [dragProxyFront, dragFrontContext]].forEach(([proxy, context]) => {
                    if (proxy.width !== width || proxy.height !== height) {
                        proxy.width = width;
                        proxy.height = height;
                    }
                    context.setTransform(density, 0, 0, density, 0, 0);
                    context.imageSmoothingEnabled = true;
                });
            }

            function clearDragProxy() {
                prepareDragCanvases();
                dragBackContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
                dragFrontContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
            }

            function getEllipticPolar(x, y, geometry) {
                const localX = x - geometry.coreX;
                const localY = (y - geometry.coreY) / geometry.diskAspect;
                return {
                    localX,
                    localY,
                    r: Math.max(0.001, Math.hypot(localX, localY)),
                    theta: Math.atan2(localY, localX),
                };
            }

            function getDepth(theta) {
                return 0.5 + 0.5 * Math.sin(theta);
            }

            // Each mesh vertex follows its own bent ray. Horizon visibility is evaluated
            // per vertex so the event horizon consumes the material instead of masking it late.
            function lensPoint(x, y, geometry, captureProgress) {
                const offsetX = x - geometry.coreX;
                const offsetY = y - geometry.coreY;
                const distance = Math.max(0.75, Math.hypot(offsetX, offsetY));
                const lensStrength = Math.pow(clamp(1 - distance / geometry.lensRadius, 0, 1), 1.32);
                const polar = getEllipticPolar(x, y, geometry);
                if (lensStrength < 0.004) {
                    return { x, y, opacity: 1, depth: getDepth(polar.theta), horizonVisibility: 1 };
                }

                const angle = Math.atan2(offsetY, offsetX);
                const inwardPull = Math.min(distance * 0.30, 15) * lensStrength;
                const sourceRadius = Math.max(2, distance - inwardPull);
                const unscaledDeflection = (7 + 780 / (distance + 18)) * lensStrength * (0.42 + lensStrength * 0.58);
                const horizonApproach = Math.pow(clamp(1 - polar.r / (geometry.captureRadius * 1.35), 0, 1), 1.45);
                const deflection = unscaledDeflection * (1 + captureProgress * 0.74 + horizonApproach * 0.92);
                const frameDrag = ACCRETION_ROTATION * (0.05 + 0.72 * lensStrength * lensStrength)
                    * (lensStrength + captureProgress * 0.58 + horizonApproach * 0.36);
                const mappedRadius = sourceRadius + deflection;
                const mappedX = geometry.coreX + Math.cos(angle + frameDrag) * mappedRadius;
                const mappedY = geometry.coreY + Math.sin(angle + frameDrag) * mappedRadius;
                const mappedPolar = getEllipticPolar(mappedX, mappedY, geometry);
                const horizonVisibility = smoothstep(
                    geometry.horizonRadius * 0.74,
                    geometry.horizonRadius * 1.20,
                    Math.min(polar.r, mappedPolar.r),
                );

                return {
                    x: mappedX,
                    y: mappedY,
                    opacity: 0.26 + horizonVisibility * 0.74,
                    depth: getDepth(mappedPolar.theta),
                    horizonVisibility,
                };
            }

            function deformSpritePoint(point, geometry) {
                const localX = point.x - spriteWidth / 2;
                const localY = point.y - spriteHeight / 2;
                const field = gravityField(dragState.x, dragState.y, geometry);
                const captureProgress = dragState.captureProgress || 0;
                const polar = getEllipticPolar(dragState.x, dragState.y, geometry);
                const nearHorizon = Math.pow(clamp(1 - polar.r / (geometry.captureRadius * 1.30), 0, 1), 1.35);
                const tidal = dragState.phase === InteractionState.CAPTURE
                    ? 0.12 + Math.pow(captureProgress, 1.12) * 0.66 + nearHorizon * 1.34
                    : field.strength * 0.24;
                const orientation = dragState.phase === InteractionState.CAPTURE
                    ? dragState.theta + Math.PI / 2
                    : Math.atan2(dragState.y - geometry.coreY, dragState.x - geometry.coreX) + Math.PI / 2 - field.strength * 0.32;
                const materialStage = smoothstep(0.48, 0.84, captureProgress);
                const streamCollapse = smoothstep(0.85, 1, captureProgress);
                const orbitScale = dragState.phase === InteractionState.CAPTURE
                    ? lerp(1, 1.12, smoothstep(0.02, 0.15, captureProgress))
                    : 1;
                const tangentialLength = dragState.phase === InteractionState.CAPTURE
                    ? orbitScale * lerp(1.04, 3.82, materialStage) * (1 + nearHorizon * 0.18)
                        * (1 - streamCollapse * 0.66)
                    : 1 + tidal * 0.82;
                const radialCompression = dragState.phase === InteractionState.CAPTURE
                    ? Math.max(0.12, orbitScale * lerp(1, 0.145, materialStage) * (1 - streamCollapse * 0.28))
                    : 1 - tidal * 0.26;
                const shear = ACCRETION_ROTATION * (localY / spriteHeight) * tidal * (4 + materialStage * 6);
                const stretchedX = (localX + shear) * tangentialLength;
                const compressedY = localY * radialCompression;
                const cosine = Math.cos(orientation);
                const sine = Math.sin(orientation);

                return {
                    x: dragState.x + cosine * stretchedX - sine * compressedY,
                    y: dragState.y + sine * stretchedX + cosine * compressedY,
                };
            }

            function drawTextureTriangle(context, sourceA, sourceB, sourceC, destinationA, destinationB, destinationC, opacity) {
                const sourceABX = sourceB.x - sourceA.x;
                const sourceABY = sourceB.y - sourceA.y;
                const sourceACX = sourceC.x - sourceA.x;
                const sourceACY = sourceC.y - sourceA.y;
                const determinant = sourceABX * sourceACY - sourceACX * sourceABY;
                if (Math.abs(determinant) < 0.00001) return;

                const destinationABX = destinationB.x - destinationA.x;
                const destinationABY = destinationB.y - destinationA.y;
                const destinationACX = destinationC.x - destinationA.x;
                const destinationACY = destinationC.y - destinationA.y;
                const a = (destinationABX * sourceACY - destinationACX * sourceABY) / determinant;
                const b = (destinationABY * sourceACY - destinationACY * sourceABY) / determinant;
                const c = (sourceABX * destinationACX - sourceACX * destinationABX) / determinant;
                const d = (sourceABX * destinationACY - sourceACX * destinationABY) / determinant;
                const e = destinationA.x - a * sourceA.x - c * sourceA.y;
                const f = destinationA.y - b * sourceA.x - d * sourceA.y;

                context.save();
                context.globalAlpha = clamp(opacity, 0, 1);
                context.beginPath();
                context.moveTo(destinationA.x, destinationA.y);
                context.lineTo(destinationB.x, destinationB.y);
                context.lineTo(destinationC.x, destinationC.y);
                context.closePath();
                context.clip();
                context.transform(a, b, c, d, e, f);
                context.drawImage(fileSprite, 0, 0);
                context.restore();
            }

            function drawMatterRibbon(context, geometry, frontLayer) {
                const trail = dragState?.trail || [];
                if (trail.length < 2) return;
                context.save();
                context.globalCompositeOperation = 'screen';
                for (let index = 1; index < trail.length; index += 1) {
                    const previous = trail[index - 1];
                    const current = trail[index];
                    const depth = (previous.depth + current.depth) * 0.5;
                    const layerWeight = frontLayer
                        ? smoothstep(0.38, 0.62, depth)
                        : 1 - smoothstep(0.38, 0.62, depth);
                    if (layerWeight < 0.02) continue;
                    const age = index / trail.length;
                    const filament = smoothstep(0.48, 0.96, dragState.captureProgress || 0);
                    context.globalAlpha = layerWeight * age * age * (0.31 + filament * 0.42);
                    context.strokeStyle = filament > 0.26
                        ? (age > 0.56 ? '#fff9df' : '#e5b85f')
                        : (age > 0.72 ? '#fff7df' : '#d8b879');
                    context.lineWidth = 0.50 + age * (1.75 + filament * 2.35);
                    context.beginPath();
                    context.moveTo(previous.x, previous.y);
                    context.lineTo(current.x, current.y);
                    context.stroke();
                }
                context.restore();
            }

            function recordMotionHistory(state, now) {
                state.motionHistory ||= [];
                const last = state.motionHistory[state.motionHistory.length - 1];
                if (last && now - last.time < 18) return;
                state.motionHistory.push({
                    x: state.x,
                    y: state.y,
                    vx: state.vx,
                    vy: state.vy,
                    time: now,
                });
                if (state.motionHistory.length > 22) state.motionHistory.shift();
            }

            function drawGravityAfterimages(context, geometry) {
                if (dragState?.phase !== InteractionState.SENSING) return;
                const history = dragState.motionHistory || [];
                const field = gravityField(dragState.x, dragState.y, geometry);
                if (history.length < 7 || field.strength < 0.035) return;
                context.save();
                context.globalCompositeOperation = 'screen';
                for (let ghost = 0; ghost < 3; ghost += 1) {
                    const sampleIndex = Math.max(0, history.length - 1 - (ghost + 1) * 4);
                    const sample = history[sampleIndex];
                    const velocityAngle = Math.atan2(sample.vy, sample.vx);
                    const strength = Math.pow(field.strength, 0.45);
                    context.save();
                    context.globalAlpha = (0.42 - ghost * 0.10) * strength;
                    context.translate(sample.x, sample.y);
                    context.rotate(velocityAngle + ACCRETION_ROTATION * (0.08 + ghost * 0.04));
                    context.scale(1 + strength * (0.08 - ghost * 0.015), 1 - strength * 0.08);
                    context.drawImage(fileSprite, -spriteWidth / 2, -spriteHeight / 2);
                    context.restore();
                }
                context.restore();
            }

            function updateShedParticles(state, geometry, deltaTime, now) {
                state.shedParticles ||= [];
                const captureProgress = state.captureProgress || 0;
                if (captureProgress > 0.14 && now - (state.lastShedAt || 0) > 48 && state.shedParticles.length < 42) {
                    state.lastShedAt = now;
                    const edgeStep = state.shedSequence = (state.shedSequence || 0) + 1;
                    const edgePhase = (edgeStep % 12) / 11 - 0.5;
                    const useLongEdge = edgeStep % 3 !== 0;
                    const tangentOffset = useLongEdge ? edgePhase * spriteWidth : (edgeStep % 2 ? -1 : 1) * spriteWidth * 0.48;
                    const radialOffset = useLongEdge ? (edgeStep % 2 ? -1 : 1) * spriteHeight * 0.40 : edgePhase * spriteHeight;
                    const tidal = 1 + captureProgress * 3.2;
                    const tangentAngle = state.theta + Math.PI / 2;
                    const edgeX = state.x
                        + Math.cos(tangentAngle) * tangentOffset * tidal
                        + Math.cos(state.theta) * radialOffset * Math.max(0.06, 1 - captureProgress * 0.65);
                    const edgeY = state.y
                        + Math.sin(tangentAngle) * tangentOffset * tidal
                        + Math.sin(state.theta) * radialOffset * Math.max(0.06, 1 - captureProgress * 0.65);
                    const edgeVelocity = 22 + (edgeStep % 4) * 8;
                    state.shedParticles.push({
                        x: edgeX,
                        y: edgeY,
                        vx: state.vx + Math.cos(tangentAngle) * edgeVelocity * ACCRETION_ROTATION,
                        vy: state.vy + Math.sin(tangentAngle) * edgeVelocity * ACCRETION_ROTATION,
                        life: 0.18 + (edgeStep % 5) * 0.025,
                        maxLife: 0.30,
                        size: 0.65 + (edgeStep % 3) * 0.26,
                    });
                }

                state.shedParticles = state.shedParticles.filter((particle) => {
                    const polar = getEllipticPolar(particle.x, particle.y, geometry);
                    const radialX = Math.cos(polar.theta);
                    const radialY = Math.sin(polar.theta) * geometry.diskAspect;
                    const tangentX = -Math.sin(polar.theta) * ACCRETION_ROTATION;
                    const tangentY = Math.cos(polar.theta) * geometry.diskAspect * ACCRETION_ROTATION;
                    const attraction = 80 + 5200 / (polar.r + 16);
                    particle.vx += (-radialX * attraction + tangentX * attraction * 0.36) * deltaTime;
                    particle.vy += (-radialY * attraction + tangentY * attraction * 0.36) * deltaTime;
                    particle.x += particle.vx * deltaTime;
                    particle.y += particle.vy * deltaTime;
                    particle.life -= deltaTime;
                    return particle.life > 0 && polar.r > geometry.horizonRadius * 0.55;
                });
            }

            function drawShedParticles(context, geometry, frontLayer) {
                const particles = dragState?.shedParticles || [];
                context.save();
                context.globalCompositeOperation = 'screen';
                particles.forEach((particle) => {
                    const polar = getEllipticPolar(particle.x, particle.y, geometry);
                    const depth = getDepth(polar.theta);
                    const layerWeight = frontLayer
                        ? smoothstep(0.38, 0.62, depth)
                        : 1 - smoothstep(0.38, 0.62, depth);
                    const life = particle.life / particle.maxLife;
                    context.globalAlpha = layerWeight * life * 0.70;
                    context.fillStyle = depth > 0.55 ? '#fff5dc' : '#c99c58';
                    context.beginPath();
                    context.arc(particle.x, particle.y, particle.size * (0.55 + life * 0.45), 0, Math.PI * 2);
                    context.fill();
                });
                context.restore();
            }

            function renderLensedDrag(now) {
                if (!dragState) return;
                prepareDragCanvases();
                dragBackContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
                dragFrontContext.clearRect(0, 0, window.innerWidth, window.innerHeight);

                const geometry = getBlackHoleGeometry();
                const field = gravityField(dragState.x, dragState.y, geometry);
                const captureProgress = dragState.captureProgress || 0;
                const visibleOpacity = dragState.materialOpacity ?? 1;
                const shouldDrawMesh = dragState.phase !== InteractionState.NORMAL || field.strength >= 0.004;
                drawGravityAfterimages(dragFrontContext, geometry);
                if (!shouldDrawMesh) {
                    dragFrontContext.globalAlpha = visibleOpacity;
                    dragFrontContext.drawImage(fileSprite, dragState.x - spriteWidth / 2, dragState.y - spriteHeight / 2);
                    dragFrontContext.globalAlpha = 1;
                    return;
                }

                drawMatterRibbon(dragBackContext, geometry, false);
                drawShedParticles(dragBackContext, geometry, false);
                const cellWidth = spriteWidth / meshColumns;
                const cellHeight = spriteHeight / meshRows;
                for (let row = 0; row < meshRows; row += 1) {
                    for (let column = 0; column < meshColumns; column += 1) {
                        const left = column * cellWidth;
                        const top = row * cellHeight;
                        const right = left + cellWidth;
                        const bottom = top + cellHeight;
                        const sourceA = { x: left, y: top };
                        const sourceB = { x: right, y: top };
                        const sourceC = { x: right, y: bottom };
                        const sourceD = { x: left, y: bottom };
                        const toScreen = (point) => {
                            const deformed = deformSpritePoint(point, geometry);
                            return lensPoint(deformed.x, deformed.y, geometry, captureProgress);
                        };
                        const destinationA = toScreen(sourceA);
                        const destinationB = toScreen(sourceB);
                        const destinationC = toScreen(sourceC);
                        const destinationD = toScreen(sourceD);
                        const drawTriangleToLayers = (source1, source2, source3, destination1, destination2, destination3) => {
                            const depth = (destination1.depth + destination2.depth + destination3.depth) / 3;
                            const horizon = (destination1.horizonVisibility + destination2.horizonVisibility + destination3.horizonVisibility) / 3;
                            const opacity = visibleOpacity * horizon
                                * (destination1.opacity + destination2.opacity + destination3.opacity) / 3;
                            if (opacity < 0.004) return;
                            const frontWeight = smoothstep(0.38, 0.62, depth);
                            const brightness = 0.15 + depth * 0.85;
                            if (frontWeight < 0.99) {
                                drawTextureTriangle(
                                    dragBackContext, source1, source2, source3, destination1, destination2, destination3,
                                    opacity * (1 - frontWeight) * brightness,
                                );
                            }
                            if (frontWeight > 0.01) {
                                drawTextureTriangle(
                                    dragFrontContext, source1, source2, source3, destination1, destination2, destination3,
                                    opacity * frontWeight * brightness,
                                );
                            }
                        };
                        drawTriangleToLayers(sourceA, sourceB, sourceC, destinationA, destinationB, destinationC);
                        drawTriangleToLayers(sourceA, sourceC, sourceD, destinationA, destinationC, destinationD);
                    }
                }
                drawMatterRibbon(dragFrontContext, geometry, true);
                drawShedParticles(dragFrontContext, geometry, true);
            }

            function beginCapture(now, geometry = getBlackHoleGeometry(), infallId) {
                if (!dragState) return;
                if (infallId) dragState.infallId = infallId;
                if (dragState.phase === InteractionState.CAPTURE) return;
                const polar = getEllipticPolar(dragState.x, dragState.y, geometry);
                const scaledVelocityY = dragState.vy / geometry.diskAspect;
                dragState.phase = InteractionState.CAPTURE;
                dragState.captureStartedAt = now;
                dragState.captureProgress = 0;
                dragState.r = polar.r;
                dragState.theta = polar.theta;
                dragState.initialRadius = polar.r;
                dragState.orbitRadius = clamp(
                    Math.max(polar.r * 0.78, geometry.captureRadius * 0.74),
                    geometry.captureRadius * 0.66,
                    geometry.captureRadius * 0.94,
                );
                dragState.radialVelocity = (polar.localX * dragState.vx + polar.localY * scaledVelocityY) / polar.r;
                dragState.angularVelocity = (polar.localX * scaledVelocityY - polar.localY * dragState.vx) / (polar.r * polar.r);
                dragState.angularMomentum = polar.r * polar.r * dragState.angularVelocity;
                dragState.trail = [];
                dragState.shedParticles = [];
                dragState.lastShedAt = now;
                dragState.materialOpacity = 1;
                dragState.motionHistory ||= [];
                setInteractionState(InteractionState.CAPTURE);
            }

            function finishCapture() {
                if (!dragState) return;
                const infallId = dragState.infallId;
                const residualTrail = dragState.trail.slice(-30);
                dragState = undefined;
                dragProxyBack.classList.remove('active');
                dragProxyFront.classList.remove('active');
                clearDragProxy();
                setInteractionState(InteractionState.COMPLETE);
                window.clearTimeout(completeStateTimer);
                completeStateTimer = window.setTimeout(() => setInteractionState(InteractionState.NORMAL), 460);
                markPrimaryVisualComplete(infallId, residualTrail);
            }

            function updateDragPhysics(now) {
                if (!dragState) return;
                const state = dragState;
                const geometry = getBlackHoleGeometry();
                const elapsed = Math.max(0, now - (state.lastFrame || now));
                const deltaTime = Math.min(0.04, elapsed / 1000 || 0.016);
                state.lastFrame = now;

                if (state.phase === InteractionState.CAPTURE) {
                    const elapsedCapture = Math.max(0, now - state.captureStartedAt);
                    const progress = clamp(elapsedCapture / CAPTURE_DURATION, 0, 1);
                    const orbitProgress = clamp(elapsedCapture / ORBIT_DURATION, 0, 1);
                    const plungeProgress = clamp((elapsedCapture - ORBIT_DURATION) / (CAPTURE_DURATION - ORBIT_DURATION), 0, 1);
                    const settle = smoothstep(0.08, 0.94, orbitProgress);
                    const orbitTarget = lerp(state.initialRadius, state.orbitRadius, settle);
                    const radialTarget = plungeProgress > 0
                        ? lerp(orbitTarget, geometry.horizonRadius * 0.08, Math.pow(plungeProgress, 0.72))
                        : orbitTarget;
                    const targetAngularVelocity = ACCRETION_ROTATION * (6.70 + orbitProgress * 0.82 + plungeProgress * 4.70);
                    const targetMomentum = targetAngularVelocity * state.r * state.r;
                    const torqueResponse = 5.25 + orbitProgress * 2.55 + plungeProgress * 5.8;
                    state.angularMomentum += (targetMomentum - state.angularMomentum) * torqueResponse * deltaTime;
                    state.angularMomentum *= Math.exp(-(0.22 + plungeProgress * 2.4) * deltaTime);
                    state.angularVelocity = state.angularMomentum / Math.max(state.r * state.r, 1);

                    const gravitationalPull = 88 + 52000 / Math.pow(state.r + 30, 2);
                    const ringRestoring = (radialTarget - state.r) * (7.8 + orbitProgress * 9.4 + plungeProgress * 22);
                    const centrifugalSupport = state.r * state.angularVelocity * state.angularVelocity * 0.075;
                    const viscousDrag = (2.4 + orbitProgress * 2.3 + plungeProgress * 6.8) * state.radialVelocity;
                    const plungeDrive = plungeProgress * (160 + 980 * plungeProgress);
                    state.radialVelocity += (
                        ringRestoring - gravitationalPull + centrifugalSupport - viscousDrag - plungeDrive
                    ) * deltaTime;
                    state.radialVelocity = clamp(state.radialVelocity, -620, 155);
                    state.r = Math.max(geometry.horizonRadius * 0.06, state.r + state.radialVelocity * deltaTime);
                    state.theta += state.angularVelocity * deltaTime;
                    state.x = geometry.coreX + Math.cos(state.theta) * state.r;
                    state.y = geometry.coreY + Math.sin(state.theta) * state.r * geometry.diskAspect;
                    state.vx = Math.cos(state.theta) * state.radialVelocity
                        - Math.sin(state.theta) * state.r * state.angularVelocity;
                    state.vy = geometry.diskAspect * (
                        Math.sin(state.theta) * state.radialVelocity
                        + Math.cos(state.theta) * state.r * state.angularVelocity
                    );
                    state.captureProgress = progress;
                    state.materialOpacity = 1;
                    state.trail.push({
                        x: state.x,
                        y: state.y,
                        vx: state.vx,
                        vy: state.vy,
                        r: state.r,
                        theta: state.theta,
                        depth: getDepth(state.theta),
                    });
                    if (state.trail.length > 38) state.trail.shift();
                    updateShedParticles(state, geometry, deltaTime, now);
                    recordMotionHistory(state, now);
                    if (progress >= 1 || (progress >= 0.96 && state.r <= geometry.horizonRadius * 0.11)) finishCapture();
                    return;
                }

                const targetField = gravityField(state.targetX, state.targetY, geometry);
                if (state.phase === InteractionState.NORMAL && targetField.strength > 0.025) {
                    state.phase = InteractionState.SENSING;
                    setInteractionState(InteractionState.SENSING);
                }

                if (state.phase === InteractionState.NORMAL) {
                    const follow = Math.min(1, deltaTime * 26);
                    state.x += (state.targetX - state.x) * follow;
                    state.y += (state.targetY - state.y) * follow;
                    recordMotionHistory(state, now);
                    return;
                }

                const field = gravityField(state.x, state.y, geometry);
                const releasing = targetField.strength < 0.018;
                const cursorPull = (64 + targetField.strength * 118) * (releasing ? 4.6 : 1);
                const influence = releasing ? 0.28 : 1;
                const gravityAcceleration = (240 + field.strength * 1800)
                    * Math.pow(Math.max(field.strength, 0.02), 0.54)
                    * influence;
                const tangentialAcceleration = (1180 + field.strength * 2200)
                    * Math.pow(Math.max(field.strength, 0.02), 0.62)
                    * influence;
                const tangentX = field.directionY * ACCRETION_ROTATION;
                const tangentY = -field.directionX * ACCRETION_ROTATION;
                state.vx += (state.targetX - state.x) * cursorPull * deltaTime;
                state.vy += (state.targetY - state.y) * cursorPull * deltaTime;
                state.vx += (field.directionX * gravityAcceleration + tangentX * tangentialAcceleration) * deltaTime;
                state.vy += (field.directionY * gravityAcceleration + tangentY * tangentialAcceleration) * deltaTime;
                const damping = Math.exp(-(4.2 - field.strength * 1.1) * deltaTime);
                state.vx *= damping;
                state.vy *= damping;
                const speed = Math.hypot(state.vx, state.vy);
                if (speed > 560) {
                    state.vx = state.vx / speed * 560;
                    state.vy = state.vy / speed * 560;
                }
                state.x += state.vx * deltaTime;
                state.y += state.vy * deltaTime;
                recordMotionHistory(state, now);
                const updatedField = gravityField(state.x, state.y, geometry);
                if (releasing && updatedField.strength < 0.018) {
                    state.phase = InteractionState.NORMAL;
                    state.vx = 0;
                    state.vy = 0;
                    setInteractionState(InteractionState.NORMAL);
                }
            }

            function runDragFrame(now) {
                dragAnimationFrame = undefined;
                updateDragPhysics(now);
                if (!dragState) return;
                renderLensedDrag(now);
                dragAnimationFrame = requestAnimationFrame(runDragFrame);
            }

            function ensureDragLoop() {
                if (!dragAnimationFrame) dragAnimationFrame = requestAnimationFrame(runDragFrame);
            }

            function drawResidualTail(context, trail, geometry, progress) {
                if (!trail?.length || trail.length < 2) return;
                const contraction = Math.pow(progress, 0.72);
                context.save();
                context.globalCompositeOperation = 'screen';
                for (let index = 1; index < trail.length; index += 1) {
                    const previous = trail[index - 1];
                    const current = trail[index];
                    const previousPolar = getEllipticPolar(previous.x, previous.y, geometry);
                    const currentPolar = getEllipticPolar(current.x, current.y, geometry);
                    const contractPoint = (polar, age) => {
                        const radius = lerp(polar.r, geometry.horizonRadius * 0.34, contraction);
                        const angle = polar.theta + ACCRETION_ROTATION * contraction * (0.32 + age * 0.52);
                        return {
                            x: geometry.coreX + Math.cos(angle) * radius,
                            y: geometry.coreY + Math.sin(angle) * radius * geometry.diskAspect,
                        };
                    };
                    const age = index / trail.length;
                    const from = contractPoint(previousPolar, age);
                    const to = contractPoint(currentPolar, age);
                    context.globalAlpha = (1 - progress * 0.42) * age * (0.42 + age * 0.36);
                    context.strokeStyle = age > 0.58 ? '#fff9df' : '#dfa84d';
                    context.lineWidth = 0.9 + age * 2.7;
                    context.beginPath();
                    context.moveTo(from.x, from.y);
                    context.lineTo(to.x, to.y);
                    context.stroke();
                }
                context.restore();
            }

            function triggerAccretionVortex(onComplete, residualTrail = []) {
                if (vortexAnimationFrame) cancelAnimationFrame(vortexAnimationFrame);
                const startedAt = performance.now();
                const duration = 250;
                dragProxyFront.classList.add('active');

                function renderVortex(now) {
                    const progress = clamp((now - startedAt) / duration, 0, 1);
                    const intensity = Math.sin(Math.PI * progress);
                    const geometry = getBlackHoleGeometry();
                    prepareDragCanvases();
                    dragFrontContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
                    drawResidualTail(dragFrontContext, residualTrail, geometry, progress);
                    dragFrontContext.save();
                    dragFrontContext.globalCompositeOperation = 'screen';
                    const nearSide = Math.PI / 2;
                    for (let index = 0; index < 10; index += 1) {
                        const lane = index / 9;
                        const radius = lerp(
                            geometry.horizonRadius * (3.2 + lane * 0.48),
                            geometry.horizonRadius * (0.76 + lane * 0.12),
                            Math.pow(progress, 0.78),
                        );
                        const angle = nearSide + ACCRETION_ROTATION * (0.22 + progress * 2.18 + lane * 0.54);
                        const nextAngle = angle + ACCRETION_ROTATION * (0.16 + lane * 0.08);
                        const innerRadius = Math.max(geometry.horizonRadius * 0.54, radius - geometry.horizonRadius * 0.46);
                        dragFrontContext.globalAlpha = intensity * (0.18 + lane * 0.075);
                        dragFrontContext.strokeStyle = lane > 0.62 ? '#fff8e5' : '#e3bb78';
                        dragFrontContext.lineWidth = 0.55 + lane * 0.75;
                        dragFrontContext.beginPath();
                        dragFrontContext.moveTo(
                            geometry.coreX + Math.cos(angle) * radius,
                            geometry.coreY + Math.sin(angle) * radius * geometry.diskAspect,
                        );
                        dragFrontContext.quadraticCurveTo(
                            geometry.coreX + Math.cos((angle + nextAngle) * 0.5) * (radius + innerRadius) * 0.5,
                            geometry.coreY + Math.sin((angle + nextAngle) * 0.5) * (radius + innerRadius) * 0.5 * geometry.diskAspect,
                            geometry.coreX + Math.cos(nextAngle) * innerRadius,
                            geometry.coreY + Math.sin(nextAngle) * innerRadius * geometry.diskAspect,
                        );
                        dragFrontContext.stroke();
                    }
                    dragFrontContext.restore();
                    if (progress < 1) {
                        vortexAnimationFrame = requestAnimationFrame(renderVortex);
                    } else {
                        vortexAnimationFrame = undefined;
                        dragFrontContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
                        dragProxyFront.classList.remove('active');
                        onComplete?.();
                    }
                }
                vortexAnimationFrame = requestAnimationFrame(renderVortex);
            }

            function finishVisualInfallIfReady() {
                if (!activeInfall || !activeInfall.primaryDone || activeInfall.secondaryPending > 0 || activeInfall.vortexStarted) return;
                activeInfall.vortexStarted = true;
                const completedId = activeInfall.id;
                triggerAccretionVortex(() => {
                    if (!activeInfall || activeInfall.id !== completedId) return;
                    activeInfall = undefined;
                    window.blackHoleHost?.completeInfall(completedId);
                }, activeInfall.primaryTrail);
            }

            function markPrimaryVisualComplete(infallId, residualTrail = []) {
                if (!infallId || !activeInfall || activeInfall.id !== infallId) {
                    triggerAccretionVortex(undefined, residualTrail);
                    return;
                }
                activeInfall.primaryDone = true;
                activeInfall.primaryTrail = residualTrail;
                finishVisualInfallIfReady();
            }

            function markSecondaryVisualComplete(infallId) {
                if (!activeInfall || activeInfall.id !== infallId) return;
                activeInfall.secondaryPending = Math.max(0, activeInfall.secondaryPending - 1);
                finishVisualInfallIfReady();
            }

            function clearGravity(force = false) {
                if (dragState?.phase === InteractionState.CAPTURE && !force) return;
                dragState = undefined;
                if (dragAnimationFrame) cancelAnimationFrame(dragAnimationFrame);
                dragAnimationFrame = undefined;
                dragProxyBack.classList.remove('active');
                dragProxyFront.classList.remove('active');
                clearDragProxy();
                if (interactionState !== InteractionState.COMPLETE) setInteractionState(InteractionState.NORMAL);
            }

            function updateGravity(event) {
                if (!containsFiles(event)) return;
                event.preventDefault();
                const firstFile = event.dataTransfer.files?.[0];
                const fileName = firstFile?.name || '文件';
                const now = performance.now();

                drawFileSprite(fileName);
                if (!dragState) {
                    dragState = {
                        phase: InteractionState.NORMAL,
                        x: event.clientX,
                        y: event.clientY,
                        targetX: event.clientX,
                        targetY: event.clientY,
                        vx: 0,
                        vy: 0,
                        opacity: 1,
                        fileName,
                        lastFrame: now,
                    };
                    setInteractionState(InteractionState.NORMAL);
                } else if (dragState.phase !== InteractionState.CAPTURE) {
                    dragState.targetX = event.clientX;
                    dragState.targetY = event.clientY;
                }
                dragProxyBack.classList.add('active');
                dragProxyFront.classList.add('active');
                ensureDragLoop();
            }

            window.addEventListener('dragenter', updateGravity);
            window.addEventListener('dragover', updateGravity);
            window.addEventListener('resize', () => {
                if (dragState) ensureDragLoop();
                else clearDragProxy();
            });
            window.addEventListener('dragleave', (event) => {
                if (!event.relatedTarget || !document.documentElement.contains(event.relatedTarget)) clearGravity();
            });

            function animateInfall(file, index, startX, startY, onComplete) {
                const card = document.createElement('div');
                const fragments = Array.from({ length: 11 }, () => {
                    const fragment = document.createElement('div');
                    fragment.className = 'matter-fragment';
                    infallLayer.appendChild(fragment);
                    return fragment;
                });
                const coreX = canvas.clientWidth / 2;
                const coreY = canvas.clientHeight / 2;
                const verticalCompression = 0.58;
                const startRadius = Math.max(7, Math.hypot(startX - coreX, (startY - coreY) / verticalCompression));
                const startAngle = Math.atan2((startY - coreY) / verticalCompression, startX - coreX);
                const direction = ACCRETION_ROTATION;
                const startedAt = performance.now() + index * 90;
                const duration = CAPTURE_DURATION;

                card.className = 'infall-card';
                card.textContent = file.name;
                card.style.transition = 'none';
                infallLayer.appendChild(card);

                function pointOnSpiral(progress) {
                    const radialProgress = Math.pow(progress, 1.65);
                    const radius = Math.max(1.4, startRadius * (1 - radialProgress));
                    const angle = startAngle + direction * (0.18 + Math.pow(progress, 2.05) * 2.86) * Math.PI * 2;
                    return {
                        x: coreX + Math.cos(angle) * radius,
                        y: coreY + Math.sin(angle) * radius * verticalCompression,
                        angle,
                    };
                }

                function renderInfall(now) {
                    const progress = Math.max(0, Math.min(1, (now - startedAt) / duration));
                    const point = pointOnSpiral(progress);
                    const tidal = smoothstep(0.16, 0.88, progress);
                    const horizonCollapse = smoothstep(0.79, 1, progress);
                    const scaleX = (1 + tidal * 1.92) * (1 - horizonCollapse * 0.86);
                    const scaleY = (1 - tidal * 0.71) * (1 - horizonCollapse * 0.62);
                    const rotation = point.angle * 180 / Math.PI + direction * Math.pow(progress, 2.05) * 470;
                    const opacity = 1 - smoothstep(0.94, 0.998, progress);

                    card.style.left = `${point.x}px`;
                    card.style.top = `${point.y}px`;
                    card.style.opacity = opacity.toFixed(3);
                    card.style.filter = `blur(${(progress * 2.1).toFixed(2)}px) brightness(${(1 - progress * 0.28).toFixed(2)})`;
                    card.style.transform = `translate(-50%, -50%) rotate(${rotation.toFixed(1)}deg) skewX(${(direction * tidal * 22).toFixed(1)}deg) scale(${scaleX.toFixed(3)}, ${scaleY.toFixed(3)})`;

                    fragments.forEach((fragment, fragmentIndex) => {
                        const trailProgress = Math.max(0, progress - fragmentIndex * 0.047);
                        const trailPoint = pointOnSpiral(trailProgress);
                        const flare = 1 - fragmentIndex / fragments.length;
                        const turbulence = Math.sin(fragmentIndex * 2.17 + progress * 19) * (1 - progress) * 8;
                        const tangentX = -Math.sin(trailPoint.angle) * turbulence;
                        const tangentY = Math.cos(trailPoint.angle) * turbulence * verticalCompression;
                        const size = 1.3 + flare * 2.3 * (1 - progress * 0.55);
                        fragment.style.left = `${trailPoint.x + tangentX}px`;
                        fragment.style.top = `${trailPoint.y + tangentY}px`;
                        fragment.style.width = `${size}px`;
                        fragment.style.height = `${size}px`;
                        fragment.style.opacity = `${Math.max(0, flare * (1 - progress * 0.7))}`;
                    });

                    if (progress < 1) {
                        requestAnimationFrame(renderInfall);
                    } else {
                        card.remove();
                        fragments.forEach((fragment) => fragment.remove());
                        onComplete?.();
                    }
                }
                requestAnimationFrame(renderInfall);
            }

            window.addEventListener('drop', (event) => {
                event.preventDefault();
                if (!dragState) return;
                beginCapture(performance.now());
                ensureDragLoop();
            });

            function showRecycleFeedback(message, color) {
                const feedback = document.createElement('div');
                feedback.className = 'recycle-feedback';
                feedback.style.color = color;
                feedback.textContent = message;
                infallLayer.appendChild(feedback);
                window.setTimeout(() => feedback.remove(), 1550);
            }

            window.blackHoleHost?.onInfall(({ id, names, clientX, clientY }) => {
                const hasPreviewCapture = Boolean(dragState);
                const secondaryNames = names.slice(hasPreviewCapture ? 1 : 0);
                activeInfall = {
                    id,
                    primaryDone: !hasPreviewCapture,
                    secondaryPending: secondaryNames.length,
                    vortexStarted: false,
                };
                if (dragState) {
                    beginCapture(performance.now(), getBlackHoleGeometry(), id);
                    ensureDragLoop();
                }
                secondaryNames.forEach((name, index) => {
                    animateInfall(
                        { name },
                        index,
                        (clientX || canvas.clientWidth / 2) + index * 12,
                        (clientY || canvas.clientHeight / 2) + index * 9,
                        () => markSecondaryVisualComplete(id),
                    );
                });
                finishVisualInfallIfReady();
            });
            window.blackHoleHost?.onRecycled((name) => {
                showRecycleFeedback(`已回收 ${name}`, '#fff6df');
            });
            window.blackHoleHost?.onRecycleFailed((name) => {
                showRecycleFeedback(`无法回收 ${name}`, '#ffd7d0');
            });
        }

        // 启动主函数
        setupInnerHalo();
        setupDesktopInteractions();
        window.onload = main;
    </script>
</body>
</html>
